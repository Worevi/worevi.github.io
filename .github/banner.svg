<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="À Antiga — Página pública de entrega do material final">
  <title>À Antiga — Página pública de entrega do material final</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232325"/>
      <stop offset="1" stop-color="#151517"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b92a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f2b92a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b92a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2b92a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f2b92a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="26" fill="url(#fundo)"/>

  <!-- halo dourado que respira devagar, atrás do logótipo -->
  <ellipse cx="600" cy="104" rx="300" ry="150" fill="url(#brilho)">
    <animate attributeName="rx" values="300;340;300" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- logótipo Worevi -->
  <g transform="translate(544 74) scale(0.808)" fill="#f2b92a">
    <path d="M0 0 L29 0 L44.5 21 L68.5 8 L115 14.8 L111.5 25.6 L69 19.5 L41 34.5 L23.5 10.5 L6 10.5 Z M119 15.3 L132 17.2 L136.3 29.2 L115.5 26.1 Z"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.25s" fill="freeze"/>
    <text x="600" y="205" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif"
          font-size="64" font-weight="600" letter-spacing="-1.6" fill="#f5f5f7">À Antiga</text>
    <text x="600" y="252" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif"
          font-size="22" font-weight="400" fill="#8e8e93">Página pública de entrega do material final</text>
  </g>

  <rect x="466.88" y="286" width="266.24" height="1.5" rx="1" fill="url(#fio)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.5s" fill="freeze"/>
  </rect>
</svg>
